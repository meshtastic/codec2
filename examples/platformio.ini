; Embedded link test for the codec2 library.
;
; The suite in ../test runs on the host and proves the codec is correct. This
; project proves it still *links* on the targets that matter, which the host
; build cannot: defines.h defines __EMBEDDED__ unconditionally, so the ARM and
; Xtensa paths differ from native and only a cross build exercises them.
;
;   cd examples
;   pio run -e nrf52840      ARM Cortex-M4F - the __ARM_ARCH path
;   pio run -e esp32s3       Xtensa LX7
;   pio run                  all of them
;
; Flash it and open the monitor at 115200 to get per-mode encode and decode
; timings, which is how you find out whether a new target can carry voice.

[platformio]
src_dir = Codec2RoundTrip

[env]
framework = arduino
lib_deps = symlink://..
monitor_speed = 115200

; Build the mode set Meshtastic ships, not the full one. Linking every mode here
; would prove nothing about the image the firmware actually produces.
build_flags =
  -Os
  -DCODEC2_MODE_EN_DEFAULT=0
  -DCODEC2_MODE_2400_EN=1
  -DCODEC2_MODE_1400_EN=1
  -DCODEC2_MODE_700C_EN=1
  -DCODEC2_MODE_450_EN=1

[env:nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
; Serial is USB CDC on the Adafruit nRF52 core, which lives in this library.
; The firmware disables it (extra_scripts/disable_adafruit_usb.py); a standalone
; example has to bring it.
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit TinyUSB Library

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
