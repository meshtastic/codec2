; One-shot provisioning firmware: writes the codec2 codebook blob to the
; external QSPI chip, then hands straight back to the UF2 bootloader.
;
; The nRF52 UF2 bootloader writes internal flash only, so the blob cannot be
; dragged onto a board. This carries it in its own image instead.
;
;   python3 ../make_codebook_blob.py ../../src src/codebook_blob.h --c-array
;   pio run -e t-echo-card
;   # drag .pio/build/t-echo-card/firmware.uf2 onto the board
;   # it writes, verifies, and reboots into DFU
;   # then drag the real Meshtastic firmware
;
; Modelled on meshtastic/nrf52_factory_erase, which avoids ever running twice
; by entering DFU as its last act rather than by leaving a marker behind.
;
; boards/ and variants/ carry the target's own definition. A stock nRF52840
; board definition does not boot on this hardware - the pin map, power rail and
; clock setup are all board specific.

[env]
; Same platform and framework fork the firmware builds with.
platform = platformio/nordicnrf52@10.12.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino#0fd295f13203e93df19d578073646ec32f2bf45a
framework = arduino
extra_scripts = post:extra_scripts/uf2.py
build_flags =
  -Os
  -DCFG_DEBUG=0
  ; Serial (CDC) is all this needs; MSC drags in SdFat, which wants an SS
  ; pin this board does not define.
  -DCFG_TUD_MSC=0
monitor_speed = 115200

[env:t-echo-card]
; A stock nRF52840 board definition is enough: nothing here depends on the
; target's variant beyond the pins below. QSPI wiring per the T-Echo-Card
; schematic; the flash sits on the RT9080 rail.
board = adafruit_feather_nrf52840
build_flags =
  ${env.build_flags}
  -D CB_QSPI_SCK=4   ; P0.04
  -D CB_QSPI_CS=12   ; P0.12
  -D CB_QSPI_IO0=6   ; P0.06
  -D CB_QSPI_IO1=8   ; P0.08
  -D CB_QSPI_IO2=41  ; P1.09
  -D CB_QSPI_IO3=26  ; P0.26
  -D CB_POWER_EN=30  ; P0.30 RT9080_EN
  -D CB_GPS_RF_EN=29 ; P0.29
